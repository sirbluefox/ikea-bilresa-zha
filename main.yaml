blueprint:
  name: ZHA - IKEA Bilresa dual button - lights & scenes
  description: >
    IKEA BILRESA dual button paired with ZHA.


    - **Single press**: toggles that button's light(s). When turning on, it uses
      your brightness / colour temperature / transition settings.

    - **Double press**: any action (e.g. activate a scene).

    - **Long press**: any action, run once when you start holding.


    The remote detects double presses itself, so single presses react
    instantly and there's no delay to configure.


    What the remote sends (ZHA): button 1 single = `on`, button 2 single = `off`,
    double = scene `press` (256 = button 1, 257 = button 2),
    long = `move` (mode 0 = button 1, mode 1 = button 2).
  domain: automation
  # Replace with the link to this file in your GitHub repo:
  source_url: https://github.com/sirbluefox/ikea-bilresa-zha/edit/main/main.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    remote:
      name: Bilresa remote
      selector:
        device:
          integration: zha

    button_1:
      name: Button 1
      icon: mdi:numeric-1-circle
      input:
        b1_lights:
          name: Light(s)
          selector:
            entity: {domain: light, multiple: true}
        b1_brightness:
          name: Brightness when turning on
          default: 100
          selector:
            number: {min: 1, max: 100, unit_of_measurement: "%"}
        b1_kelvin:
          name: Colour temperature when turning on
          description: 0 = don't change (keep the light's last colour).
          default: 0
          selector:
            number: {min: 0, max: 6500, step: 50, unit_of_measurement: K}
        b1_transition:
          name: Transition
          default: 0.5
          selector:
            number: {min: 0, max: 10, step: 0.1, unit_of_measurement: s}
        b1_double:
          name: Double press action
          description: e.g. Scene > Activate
          default: []
          selector:
            action: {}
        b1_long:
          name: Long press action
          default: []
          selector:
            action: {}

    button_2:
      name: Button 2
      icon: mdi:numeric-2-circle
      input:
        b2_lights:
          name: Light(s)
          selector:
            entity: {domain: light, multiple: true}
        b2_brightness:
          name: Brightness when turning on
          default: 100
          selector:
            number: {min: 1, max: 100, unit_of_measurement: "%"}
        b2_kelvin:
          name: Colour temperature when turning on
          description: 0 = don't change (keep the light's last colour).
          default: 0
          selector:
            number: {min: 0, max: 6500, step: 50, unit_of_measurement: K}
        b2_transition:
          name: Transition
          default: 0.5
          selector:
            number: {min: 0, max: 10, step: 0.1, unit_of_measurement: s}
        b2_double:
          name: Double press action
          description: e.g. Scene > Activate
          default: []
          selector:
            action: {}
        b2_long:
          name: Long press action
          default: []
          selector:
            action: {}

mode: single
max_exceeded: silent

variables:
  b1_lights: !input b1_lights
  b1_brightness: !input b1_brightness
  b1_kelvin: !input b1_kelvin
  b1_transition: !input b1_transition
  b2_lights: !input b2_lights
  b2_brightness: !input b2_brightness
  b2_kelvin: !input b2_kelvin
  b2_transition: !input b2_transition

triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote

conditions:
  - condition: template
    value_template: >
      {{ trigger.event.data.command in ['on', 'off', 'press', 'move'] }}

actions:
  - variables:
      cmd: "{{ trigger.event.data.command }}"
      params: "{{ trigger.event.data.params | default({}) }}"
      press_id: "{{ params.param1 | default(0) | int(0) }}"
      move_mode: "{{ params.move_mode | default(-1) | int(-1) }}"
      btn: >
        {% if cmd == 'on' or (cmd == 'press' and press_id == 256) or (cmd == 'move' and move_mode == 0) %}1
        {% elif cmd == 'off' or (cmd == 'press' and press_id == 257) or (cmd == 'move' and move_mode == 1) %}2
        {% else %}0{% endif %}
      lights: "{{ b1_lights if btn | int == 1 else b2_lights }}"
      brightness: "{{ (b1_brightness if btn | int == 1 else b2_brightness) | int }}"
      kelvin: "{{ (b1_kelvin if btn | int == 1 else b2_kelvin) | int }}"
      transition: "{{ (b1_transition if btn | int == 1 else b2_transition) | float }}"

  - choose:
      # Single press: toggle with custom settings
      - conditions:
          - condition: template
            value_template: "{{ cmd in ['on', 'off'] }}"
        sequence:
          - if:
              - condition: template
                value_template: >
                  {{ expand(lights) | selectattr('state', 'eq', 'on') | list | count > 0 }}
            then:
              - action: light.turn_off
                target:
                  entity_id: "{{ lights }}"
                data:
                  transition: "{{ transition }}"
            else:
              - action: light.turn_on
                target:
                  entity_id: "{{ lights }}"
                data: >
                  {% set d = {'brightness_pct': brightness, 'transition': transition} %}
                  {% if kelvin > 0 %}{% set d = dict(d, color_temp_kelvin=kelvin) %}{% endif %}
                  {{ d }}

      # Double press
      - conditions:
          - condition: template
            value_template: "{{ cmd == 'press' and btn | int == 1 }}"
        sequence: !input b1_double
      - conditions:
          - condition: template
            value_template: "{{ cmd == 'press' and btn | int == 2 }}"
        sequence: !input b2_double

      # Long press (runs once, then waits for release so repeats are ignored)
      - conditions:
          - condition: template
            value_template: "{{ cmd == 'move' and btn | int == 1 }}"
        sequence:
          - sequence: !input b1_long
          - wait_for_trigger:
              - trigger: event
                event_type: zha_event
                event_data:
                  device_id: !input remote
                  command: move_up_release
            timeout: "00:00:15"
      - conditions:
          - condition: template
            value_template: "{{ cmd == 'move' and btn | int == 2 }}"
        sequence:
          - sequence: !input b2_long
          - wait_for_trigger:
              - trigger: event
                event_type: zha_event
                event_data:
                  device_id: !input remote
                  command: move_down_release
            timeout: "00:00:15"
